name: Vulnerability check

# govulncheck reports known vulnerabilities (Go vulnerability database) in
# the code paths the backend actually calls - not just every advisory in
# go.sum - so a failure here means a vulnerable function is reachable.
# Kept out of ci-release.yml on purpose: the weekly schedule catches
# advisories published after a dependency was merged, without touching the
# release jobs, and a newly published advisory can't block a release of an
# already-merged fix.
# Not on pushes to main: a merged PR already passed this check on a branch
# up to date with main.
on:
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, ahead of Renovate's Monday window
  workflow_dispatch:

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A required check: it skips on docs-only PRs instead of not reporting
  # (see ci-release.yml).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Did the PR change code?
        id: diff
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
              grep -qvE '^(\.claude/|docs/|deploy/|tests/|assets/)|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  govulncheck-backend:
    runs-on: ubuntu-latest
    needs: [changes]
    # Runs when code changed, and also if the changes job failed (fail safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install tools
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # cmd/main.go imports the generated swagger package (gitignored), so
      # it has to exist for govulncheck to load the program.
      - name: Generate swagger docs
        run: |
          cd backend
          swag init -d . -g cmd/main.go -o swagger

      - name: Run govulncheck
        run: |
          cd backend
          govulncheck ./...
