name: Live demo

# Publishes the live demo (https://demo.obzly.com) to GitHub Pages: the real
# UI built with `npm run build:demo`, which answers every API call in the
# browser from generated sample data (frontend/src/demo). Each release
# updates it; run it by hand to publish main in between.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build the demo
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          # The version the UI shows: the release tag, or the latest tag plus commits.
          VITE_APP_VERSION="$(git describe --tags --always)" npm run build:demo

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
