apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi
  namespace: obzly-obi
---
# Read-only, cluster-scoped: only what OBI needs to label flows with
# Kubernetes owner/namespace metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi-obzly-obi
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi-obzly-obi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi-obzly-obi
subjects:
  - kind: ServiceAccount
    name: obi
    namespace: obzly-obi
