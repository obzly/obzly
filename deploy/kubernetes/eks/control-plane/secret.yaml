# TEMPLATE - see ../secret.yaml's own doc comment (same conventions:
# fill in and apply separately, or swap for your own secret-management
# tool, never commit real values, deliberately excluded from
# kustomization.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: obzly-control-plane-secrets
  namespace: obzly-control-plane
type: Opaque
stringData:
  # A control plane's OWN Postgres - never shared with a Site's, or with
  # another control plane. Externally-hosted (RDS/Aurora/etc), same DSN
  # format as ../secret.yaml.
  DATABASE_DSN: "host=<RDS_ENDPOINT> user=<DB_USER> password=<DB_PASSWORD> dbname=obzly port=5432 sslmode=require"

  # Optional - only needed if you enable Github/Google sign-in centrally.
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Required: the control plane's own Valkey password (valkey-deployment.yaml
  # starts it with --requirepass; the app connects with the same key), e.g.
  # `openssl rand -hex 32`.
  VALKEY_PASSWORD: "<RANDOM_SECRET>"
