# IRSA (IAM Roles for Service Accounts) - the AWS SDK v2 credential chain
# s3blob uses (see backend/internal/config/config.go's ObjectStorageURL doc
# comment) picks up the role automatically via the AWS_ROLE_ARN/
# AWS_WEB_IDENTITY_TOKEN_FILE env vars EKS's Pod Identity webhook injects
# into any pod using this ServiceAccount - no AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY needed anywhere. The IAM role itself (trust policy
# + S3 bucket permissions) is created outside this repo (eksctl/Terraform/
# etc.) - this annotation just points at it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obzly
  namespace: obzly
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/<OBZLY_S3_ROLE_NAME>"
