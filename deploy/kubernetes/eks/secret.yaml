# TEMPLATE - fill in the placeholders below and apply this file
# separately (`kubectl apply -f secret.yaml`), or replace it entirely
# with your own secret-management tool (External Secrets Operator,
# Sealed Secrets, AWS Secrets Manager CSI driver, etc.) - whichever you
# use, keep the Secret's name/namespace/keys the same so deployment.yaml's
# envFrom keeps working unchanged.
#
# Deliberately NOT included in kustomization.yaml, so `kubectl apply -k`
# never applies placeholder credentials by accident. Never commit this
# file to git with real values filled in.
apiVersion: v1
kind: Secret
metadata:
  name: obzly-secrets
  namespace: obzly
type: Opaque
stringData:
  # Externally-hosted Postgres (RDS/Aurora/etc). Format matches
  # backend/.env.production.example's DATABASE_DSN exactly - the app
  # parses this with its own DSN parser, not a URL.
  DATABASE_DSN: "host=<RDS_ENDPOINT> user=<DB_USER> password=<DB_PASSWORD> dbname=obzly port=5432 sslmode=require"

  # Optional - only needed if you enable Github/Google sign-in. Leave
  # blank otherwise.
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Required by ha/ (unused by the single-replica manifests). Long random
  # strings, e.g. `openssl rand -hex 32`:
  # - NATS_TOKEN: shared by the JetStream brokers and their clients.
  # - QUERIER_TOKEN: shared by obzly-api and the query executors.
  NATS_TOKEN: "<RANDOM_SECRET>"
  QUERIER_TOKEN: "<RANDOM_SECRET>"

  # Required: the in-cluster Valkey's password (common/valkey-deployment.yaml
  # starts it with --requirepass; the app connects with the same key). A
  # long random string, e.g. `openssl rand -hex 32`. Use your provider's
  # auth token here if you point VALKEY_HOST at ElastiCache instead.
  VALKEY_PASSWORD: "<RANDOM_SECRET>"

