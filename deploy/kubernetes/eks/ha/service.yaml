# Points at obzly-api's pods only - obzly-worker serves nothing, so it
# has no Service. Same ClusterIP/no-Ingress reasoning as ../service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: obzly-api
  namespace: obzly
spec:
  selector:
    app: obzly-api
  ports:
    - name: http
      port: 4005
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
