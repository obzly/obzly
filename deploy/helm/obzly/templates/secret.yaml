{{- if not .Values.secrets.existingSecret }}
{{- $name := include "obzly.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $data := (get $existing "data") | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "obzly.labels" (dict "root" . "component" "obzly") | nindent 4 }}
type: Opaque
data:
  DATABASE_DSN: {{ required "secrets.databaseDsn (or secrets.existingSecret) is required" .Values.secrets.databaseDsn | b64enc | quote }}
  {{- if eq .Values.mode "ha" }}
  {{- /* Generated once, then read back from the cluster on upgrades. */}}
  NATS_TOKEN: {{ .Values.secrets.natsToken | default (get $data "NATS_TOKEN" | default "" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  QUERIER_TOKEN: {{ .Values.secrets.querierToken | default (get $data "QUERIER_TOKEN" | default "" | b64dec) | default (randAlphaNum 48) | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.valkeyPassword }}
  VALKEY_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
