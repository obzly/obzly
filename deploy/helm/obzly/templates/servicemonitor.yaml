{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $fullname := include "obzly.fullname" . }}
# Scrapes every obzly pod of this release (all tiers) on its metrics port.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "obzly.labels" (dict "root" . "component" "obzly") | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "obzly.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [valkey]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
