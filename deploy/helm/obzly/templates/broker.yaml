{{- if eq .Values.mode "ha" }}
{{- $fullname := include "obzly.fullname" . }}
{{- $replicas := int .Values.broker.replicas }}
{{- if not (or (eq $replicas 1) (ge $replicas 3)) }}
{{- fail "broker.replicas must be 1 or at least 3: two brokers can't form a quorum" }}
{{- end }}
{{- $ctx := dict "root" . "component" "broker" }}
# The NATS JetStream ingest buffer: acknowledged batches wait here until a
# worker writes them, so brokers keep their disks and roll one at a time.
apiVersion: v1
kind: Service
metadata:
  # Peer discovery: stable per-pod names, published before pods are ready.
  name: {{ $fullname }}-broker-headless
  labels:
    {{- include "obzly.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "obzly.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: client
      port: 4222
    - name: cluster
      port: 6222
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-broker
  labels:
    {{- include "obzly.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "obzly.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: client
      port: 4222
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-broker
  labels:
    {{- include "obzly.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "obzly.selectorLabels" $ctx | nindent 6 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-broker
  labels:
    {{- include "obzly.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-broker-headless
  replicas: {{ $replicas }}
  # A lone first pod can't reach quorum anyway.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "obzly.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- include "obzly.podMetadata" (merge (dict "metrics" true) $ctx) | nindent 6 }}
    spec:
      {{- include "obzly.podSpec" (dict "root" . "tier" .Values.broker) | nindent 6 }}
      # Above the 30 s lame-duck period.
      terminationGracePeriodSeconds: 60
      {{- if .Values.broker.zoneSpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "obzly.selectorLabels" $ctx | nindent 14 }}
      {{- end }}
      containers:
        - name: obzly
          {{- include "obzly.containerBase" . | nindent 10 }}
          env:
            - name: SERVICE_MODE
              value: "broker"
            - name: NATS_SERVER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if gt $replicas 1 }}
            - name: NATS_ROUTES
              value: >-
                {{- range $i := until $replicas }}
                {{ printf "nats-route://%s-broker-%d.%s-broker-headless.%s.svc:6222" $fullname $i $fullname $.Release.Namespace }}{{ if lt (add1 $i) $replicas }},{{ end }}
                {{- end }}
            {{- end }}
            - name: JETSTREAM_DIR
              value: /jetstream
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
            {{- include "obzly.metricsPort" . | nindent 12 }}
          # NATS's own health endpoint on the monitoring port.
          startupProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitor
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: jetstream
              mountPath: /jetstream
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.broker.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.broker.storage.size }}
{{- if .Values.broker.networkPolicy }}
---
# Clients (NATS_TOKEN is the second check) and peer routes from this
# release's pods only; probes and scrapers keep the monitor/metrics ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-broker
  labels:
    {{- include "obzly.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "obzly.selectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "obzly.releasePods" . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 6222
    - ports:
        - protocol: TCP
          port: 8222
        {{- if .Values.metrics.enabled }}
        - protocol: TCP
          port: {{ .Values.metrics.port }}
        {{- end }}
{{- end }}
{{- end }}
