{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obzly-probe.fullname" . }}
  labels:
    {{- include "obzly-probe.labels" . | nindent 4 }}
type: Opaque
stringData:
  OBZLY_PROBE_TOKEN: {{ required "token (or existingSecret) is required" .Values.token | quote }}
{{- end }}
