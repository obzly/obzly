basePath: /api/v1
definitions:
  access_tokens.AccessTokenDTO:
    properties:
      createdAt:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      lastUsedAt:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      tokenPrefix:
        type: string
    type: object
  access_tokens.CreateAccessTokenRequestDTO:
    properties:
      expiresInDays:
        enum:
        - 30
        - 90
        - 365
        type: integer
      mfaCode:
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - expiresInDays
    - name
    type: object
  access_tokens.CreateAccessTokenResponseDTO:
    properties:
      accessToken:
        $ref: '#/definitions/access_tokens.AccessTokenDTO'
      token:
        description: Token is the full value, returned only here.
        type: string
    type: object
  access_tokens.ListAccessTokensResponseDTO:
    properties:
      accessTokens:
        items:
          $ref: '#/definitions/access_tokens.AccessTokenDTO'
        type: array
    type: object
  aiusage.BreakdownRowDTO:
    properties:
      cacheCreationTokens:
        type: integer
      cacheReadTokens:
        type: integer
      costUsd:
        type: number
      inputTokens:
        type: integer
      key:
        type: string
      lastSeen:
        type: integer
      outputTokens:
        type: integer
      requests:
        type: integer
      sessions:
        type: integer
    type: object
  aiusage.Budget:
    properties:
      amountUsd:
        type: number
      channelIds:
        items:
          type: string
        type: array
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      includeClaudeCode:
        type: boolean
      includeLlmApps:
        type: boolean
      name:
        type: string
      period:
        type: string
      projectId:
        type: string
      scope:
        type: string
      scopeValue:
        type: string
      thresholds:
        description: Thresholds are percents of AmountUSD, ascending.
        items:
          type: number
        type: array
      timeZone:
        type: string
      updatedAt:
        type: string
    type: object
  aiusage.BudgetGroupDTO:
    properties:
      key:
        type: string
      percent:
        description: |-
          Percent of the budget; for project and one-user budgets the top list
          is by model, as a share of the budget too.
        type: number
      spentUsd:
        type: number
    type: object
  aiusage.BudgetRequest:
    properties:
      amountUsd:
        type: number
      channelIds:
        items:
          type: string
        type: array
      includeClaudeCode:
        description: IncludeClaudeCode defaults to true.
        type: boolean
      includeLlmApps:
        type: boolean
      name:
        type: string
      period:
        type: string
      scope:
        type: string
      scopeValue:
        type: string
      thresholds:
        description: Thresholds default to 80 and 100.
        items:
          type: number
        type: array
      timeZone:
        type: string
    type: object
  aiusage.BudgetStatusDTO:
    properties:
      budgetId:
        type: string
      error:
        type: string
      forecastUsd:
        type: number
      groups:
        description: |-
          Groups: users or models with spend (each_* only), and how many are
          past the first threshold (below 100%) or at 100% and over.
        type: integer
      groupsOver:
        type: integer
      groupsWarning:
        type: integer
      percent:
        description: |-
          Percent and ForecastUSD are the budget's, or for each user/model
          budgets the highest-spending one's.
        type: number
      periodEnd:
        type: integer
      periodStart:
        description: Current period, Unix ms; it resets at PeriodEnd.
        type: integer
      spentUsd:
        description: SpentUSD is the scope's total (every user or model for each_*).
        type: number
      top:
        items:
          $ref: '#/definitions/aiusage.BudgetGroupDTO'
        type: array
    type: object
  aiusage.ErrorRowDTO:
    properties:
      count:
        type: integer
      error:
        type: string
      lastSeen:
        type: integer
      model:
        type: string
      statusCode:
        type: string
    type: object
  aiusage.EventsResponseDTO:
    properties:
      eventTypes:
        description: Event names present in the range (ignoring the event, session
          and search filters).
        items:
          type: string
        type: array
      events:
        description: Newest first.
        items:
          $ref: '#/definitions/aiusage.SessionEventDTO'
        type: array
      total:
        type: integer
    type: object
  aiusage.FillCommonPricesResponseDTO:
    properties:
      added:
        type: integer
      asOf:
        type: string
      models:
        items:
          type: string
        type: array
    type: object
  aiusage.FilterOptionsDTO:
    properties:
      models:
        items:
          type: string
        type: array
      terminals:
        items:
          type: string
        type: array
      users:
        items:
          type: string
        type: array
    type: object
  aiusage.LLMBreakdownRowDTO:
    properties:
      calls:
        type: integer
      costUsd:
        description: CostUSD is nil when no tokens of the group have a price.
        type: number
      errors:
        type: integer
      hasTokens:
        description: 'HasTokens: some calls reported tokens (tool and agent spans
          don''t).'
        type: boolean
      inputTokens:
        type: integer
      key:
        type: string
      outputTokens:
        type: integer
      p95Ms:
        type: number
      unpriced:
        description: 'Unpriced: some tokens are of a model without a price.'
        type: boolean
    type: object
  aiusage.LLMCallDTO:
    properties:
      durationMs:
        type: number
      errorType:
        type: string
      finishReasons:
        items:
          type: string
        type: array
      inputTokens:
        type: integer
      isError:
        type: boolean
      kind:
        description: Kind is "slow" or "failed".
        type: string
      model:
        type: string
      operation:
        type: string
      outputTokens:
        type: integer
      provider:
        type: string
      serverAddress:
        type: string
      service:
        type: string
      spanId:
        type: string
      timestamp:
        type: integer
      traceId:
        type: string
    type: object
  aiusage.LLMCallsResponseDTO:
    properties:
      failed:
        items:
          $ref: '#/definitions/aiusage.LLMCallDTO'
        type: array
      slowest:
        items:
          $ref: '#/definitions/aiusage.LLMCallDTO'
        type: array
    type: object
  aiusage.LLMOverviewResponseDTO:
    properties:
      breakdown:
        items:
          $ref: '#/definitions/aiusage.LLMBreakdownRowDTO'
        type: array
      bucketSeconds:
        type: integer
      groupBy:
        type: string
      latestCallAt:
        description: Newest call in the range, Unix ms (0 when there is none).
        type: integer
      summary:
        $ref: '#/definitions/aiusage.LLMSummaryDTO'
      timeseries:
        items:
          $ref: '#/definitions/aiusage.LLMTimeseriesPointDTO'
        type: array
    type: object
  aiusage.LLMSummaryDTO:
    properties:
      cachedTokens:
        type: integer
      calls:
        type: integer
      costUsd:
        description: CostUSD covers models with a price only (see UnpricedModels).
        type: number
      errors:
        type: integer
      inputTokens:
        type: integer
      outputTokens:
        type: integer
      p50Ms:
        type: number
      p95Ms:
        type: number
      services:
        type: integer
      unpricedModels:
        description: UnpricedModels used tokens but have no price.
        items:
          type: string
        type: array
    type: object
  aiusage.LLMTimeseriesPointDTO:
    properties:
      bucket:
        description: Bucket start, Unix milliseconds.
        type: integer
      calls:
        type: integer
      inputTokens:
        type: integer
      model:
        type: string
      outputTokens:
        type: integer
    type: object
  aiusage.ModelPrice:
    properties:
      cachedInputPerMillion:
        type: number
      createdAt:
        type: string
      id:
        type: string
      inputPerMillion:
        type: number
      model:
        type: string
      outputPerMillion:
        type: number
      projectId:
        type: string
      updatedAt:
        type: string
    type: object
  aiusage.ModelPriceRequest:
    properties:
      cachedInputPerMillion:
        type: number
      inputPerMillion:
        type: number
      model:
        type: string
      outputPerMillion:
        type: number
    type: object
  aiusage.ModelPriceRowDTO:
    properties:
      cachedInputPerMillion:
        type: number
      createdAt:
        type: string
      id:
        type: string
      inputPerMillion:
        type: number
      model:
        type: string
      outputPerMillion:
        type: number
      projectId:
        type: string
      seenCalls:
        description: |-
          SeenCalls: LLM calls in the last 24 h this price applies to (-1 when
          the spans couldn't be read).
        type: integer
      updatedAt:
        type: string
    type: object
  aiusage.ModelPricesResponseDTO:
    properties:
      prices:
        items:
          $ref: '#/definitions/aiusage.ModelPriceRowDTO'
        type: array
      seenError:
        type: string
      unpricedModels:
        description: UnpricedModels were seen in LLM calls in the last 24 h without
          a price.
        items:
          $ref: '#/definitions/aiusage.SeenModelDTO'
        type: array
    type: object
  aiusage.OverviewResponseDTO:
    properties:
      bucketSeconds:
        type: integer
      errors:
        items:
          $ref: '#/definitions/aiusage.ErrorRowDTO'
        type: array
      filterOptions:
        $ref: '#/definitions/aiusage.FilterOptionsDTO'
      latestEventAt:
        description: Newest matching event in the range, Unix ms (0 when there is
          none).
        type: integer
      models:
        items:
          $ref: '#/definitions/aiusage.BreakdownRowDTO'
        type: array
      summary:
