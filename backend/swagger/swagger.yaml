      firstSeen:
        type: integer
      lastSeen:
        type: integer
      models:
        items:
          type: string
        type: array
      prompts:
        type: integer
      requests:
        type: integer
      sessionId:
        type: string
      terminal:
        type: string
      tokens:
        type: integer
      toolCalls:
        type: integer
      user:
        type: string
    type: object
  aiusage.SessionsResponseDTO:
    properties:
      sessions:
        items:
          $ref: '#/definitions/aiusage.SessionRowDTO'
        type: array
      total:
        type: integer
    type: object
  aiusage.TimeseriesPointDTO:
    properties:
