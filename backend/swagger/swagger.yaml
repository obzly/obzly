        type: string
      name:
        type: string
      projectId:
        type: string
      status:
        $ref: '#/definitions/api_keys.ApiKeyStatus'
      token:
        description: Temporary field only populated during creation
        type: string
      tokenPrefix:
        type: string
    type: object
  api_keys.ApiKeyStatus:
    enum:
    - ACTIVE
    - DISABLED
    - NOT_FOUND
    type: string
    x-enum-varnames:
    - ApiKeyStatusActive
    - ApiKeyStatusDisabled
    - ApiKeyStatusNotFound
  api_keys.BulkDeleteApiKeysRequestDTO:
    properties:
      apiKeyIds:
        items:
          type: string
        minItems: 1
