  /logs/receiving/{projectId}:
    post:
      consumes:
      - application/json
      description: |-
        Submit one or more log items to the specified project. Validates project access, API keys (if required), domain/IP filtering (if enabled), rate limits, and individual log requirements.

        **Validation Requirements:**
        - Project must exist and be accessible
        - API Key: Required if project has `isApiKeyRequired=true`
        - Domain Filtering: Origin header required if project has `isFilterByDomain=true` with matching allowed domain
        - IP Filtering: Client IP must match allowed IPs/CIDRs if project has `isFilterByIP=true`
        - Rate Limiting: Requests limited by project's `logsPerSecondLimit` with burst capability (5x multiplier)
        - Batch Limits: Maximum 5000 logs per batch, maximum 10MB total batch size
        - Log Requirements: Valid log level (DEBUG/INFO/WARN/ERROR), non-empty message, log size within project's `maxLogSizeKB` limit (timestamp automatically set by server)
      parameters:
      - description: Project ID (UUID format)
        in: path
        name: projectId
        required: true
        type: string
      - description: API Key (required if project has isApiKeyRequired=true)
        in: header
        name: X-API-Key
        type: string
      - description: Origin header (required if project has domain filtering enabled)
        in: header
        name: Origin
        type: string
      - description: Client IP for IP filtering (auto-detected from various headers)
        in: header
        name: X-Forwarded-For
        type: string
      - description: Log items to submit (1-5000 logs, max 10MB total, timestamp automatically
          set by server)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/logs_receiving.SubmitLogsRequestDTO'
      produces:
      - application/json
      responses:
        "202":
          description: Logs accepted (may include partial rejection for invalid logs)
          schema:
            $ref: '#/definitions/logs_receiving.SubmitLogsResponseDTO'
        "400":
          description: Invalid request format, project ID, or batch limits exceeded
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: API key required or invalid
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Domain not allowed or IP not allowed
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Project quota exceeded or request body over 20MB
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Rate limit exceeded or ingest buffer full
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Ingest buffer unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit logs to project
      tags:
      - logs
