      value:
        type: string
    type: object
  alerting.NotificationChannel:
    properties:
      allProjects:
        type: boolean
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      kind:
        type: string
      name:
        type: string
      projectIds:
        items:
          type: string
        type: array
      source:
        type: string
      target:
        description: |-
          Target is a non-secret description of where it sends (a URL's host,
          a key's last characters, the recipients).
        type: string
      updatedAt:
        type: string
    type: object
  alerting.PreviewSeries:
    properties:
      firing:
        type: boolean
      labels:
        $ref: '#/definitions/alerting.Labels'
      value:
        type: number
    type: object
  alerting.RuleQuery:
    properties:
      baselineSeconds:
        type: integer
      budgetId:
        description: BudgetID is the AI budget an ai_cost rule watches, or the cost
          budget a cloud_cost rule does.
        type: string
      costAnomalies:
        description: 'CostAnomalies: a cloud_cost rule that fires for each new cost
          anomaly.'
        type: boolean
      costCommitments:
        description: |-
          CostCommitments: a cloud_cost rule whose series are the days left on each commitment
          ending soon.
        type: boolean
      groupBy:
        type: string
      logs:
        $ref: '#/definitions/logs_core.QueryNode'
      metric:
        type: string
      minCount:
        type: integer
      minSeverity:
        description: 'MinSeverity: a cloud_posture rule fires for new or reopened
          findings this severe or more.'
        type: string
      operationName:
        type: string
      promql:
        type: string
      rootSpansOnly:
        type: boolean
      serviceName:
        type: string
    type: object
  alerting.RuleRequest:
    properties:
      channelIds:
        items:
          type: string
        type: array
      comparison:
        type: string
      enabled:
        type: boolean
      forSeconds:
        type: integer
      intervalSeconds:
        type: integer
      labels:
        $ref: '#/definitions/alerting.Labels'
      name:
        type: string
      query:
        $ref: '#/definitions/alerting.RuleQuery'
      repeatSeconds:
        type: integer
      source:
        type: string
      summary:
        type: string
      threshold:
        type: number
      windowSeconds:
