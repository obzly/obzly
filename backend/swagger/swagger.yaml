        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      timestamp:
        description: Unix milliseconds.
        type: integer
    type: object
  aiusage.SessionEventsResponseDTO:
    properties:
      events:
        items:
          $ref: '#/definitions/aiusage.SessionEventDTO'
        type: array
