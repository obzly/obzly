  /projects/dashboards/{projectId}/query/stream:
    post:
      consumes:
      - application/json
      description: Same request as /query; the answer is newline-delimited JSON frames.
        A time-bucketed logs panel is read partition group by partition group, newest
        first, and each "buckets" frame's buckets add to the earlier ones' (the same
        bucket and group can come again); any other panel is one "buckets" frame.
        Then "done", or "error" with status. "heartbeat" frames keep the connection
        alive. A refused query (403, 400) is a plain JSON error before any frame.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Panel query request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dashboards_dto.PanelQueryRequestDTO'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dashboards_dto.PanelFrameDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run one panel's aggregation query, streamed
      tags:
      - dashboards
