      timeseries:
        items:
          $ref: '#/definitions/aiusage.TimeseriesPointDTO'
        type: array
      tools:
        items:
          $ref: '#/definitions/aiusage.ToolRowDTO'
        type: array
      users:
        items:
          $ref: '#/definitions/aiusage.BreakdownRowDTO'
        type: array
    type: object
  aiusage.SeenModelDTO:
    properties:
      calls:
