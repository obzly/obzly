  alerting.SettingsChannel:
    properties:
      allProjects:
        type: boolean
      id:
        type: string
      kind:
        type: string
      name:
        type: string
      projectIds:
        items:
          type: string
        type: array
      scope:
        $ref: '#/definitions/sharedconfig.Scope'
      source:
        type: string
      target:
        type: string
      updatedAt:
        type: string
      usedBy:
        type: integer
    type: object
  alerting.SettingsChannelRequest:
    properties:
      allProjects:
        type: boolean
      config:
        $ref: '#/definitions/alerting.ChannelConfig'
      kind:
        type: string
      name:
        type: string
      projectIds:
        items:
          type: string
        type: array
      scope:
        $ref: '#/definitions/sharedconfig.Scope'
    type: object
  alerting.Silence:
    properties:
      comment:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      endsAt:
        type: string
      id:
        type: string
      managedBy:
        description: |-
          ManagedBy names what maintains this silence ("synthetics-maintenance:
