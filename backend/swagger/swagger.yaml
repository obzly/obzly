  alerting.SilenceRequest:
    properties:
      comment:
        type: string
      endsAt:
        type: string
      matchers:
        items:
          $ref: '#/definitions/alerting.Matcher'
        type: array
      startsAt:
        type: string
    type: object
  api_keys.ApiKey:
    properties:
      createdAt:
        type: string
      id:
        type: string
      lastUsedAt:
        description: |-
          LastUsedAt is nil when the key has never been used to authenticate a
