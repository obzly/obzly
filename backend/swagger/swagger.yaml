        type: string
    type: object
  aiusage.UsageSummaryDTO:
    properties:
      apiErrors:
        type: integer
      avgDurationMs:
        type: number
      cacheCreationTokens:
        type: integer
      cacheReadTokens:
        type: integer
      costUsd:
        type: number
      inputTokens:
        type: integer
      outputTokens:
        type: integer
      p50TtftMs:
        type: number
      prompts:
        type: integer
      requests:
        type: integer
      sessions:
        type: integer
      toolCalls:
        type: integer
      users:
        type: integer
    type: object
  alerting.AlertRule:
    properties:
      channelIds:
        items:
          type: string
        type: array
      comparison:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      enabled:
        type: boolean
      forSeconds:
        type: integer
      id:
        type: string
      intervalSeconds:
        type: integer
      labels:
        $ref: '#/definitions/alerting.Labels'
      lastError:
        type: string
      lastEvalAt:
        type: string
      managedBy:
        description: |-
          ManagedBy names the feature that maintains this rule
