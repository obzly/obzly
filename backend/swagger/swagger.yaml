        each section that came back ok replaces the connection's data once every chunk
        has arrived
      parameters:
      - description: The destination project's ingest key
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Receive cost recommendations from a probe
      tags:
      - cloud-cost
  /v1/cloud/cost:
    post:
      consumes:
      - application/json
