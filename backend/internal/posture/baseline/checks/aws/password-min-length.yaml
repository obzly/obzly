id: aws-password-min-length
provider: aws
resource: aws_account
title: The IAM password policy should require 14 or more characters
severity: medium
control: IAM.15
standards:
  - {standard: aws-fsbp, control: IAM.15}
  - {standard: cis-aws, control: "1.8"}
pass: r.password_min_length >= 14
evidence: [password_min_length]
remediation:
  cli: aws iam update-account-password-policy --minimum-password-length 14
  iac: "# Not a CloudFormation resource: run the CLI command once per account."
  console: IAM → Account settings → Password policy → Edit → Password minimum length 14.
fixtures:
  pass: [{password_min_length: 14}, {password_min_length: 20}]
  fail: [{password_min_length: 0}, {password_min_length: 8}]
